<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jardín Mágico de Estadias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --transition-speed: 2s;
        }

        body.night-mode {
            --sky-top: #0b1026;
            --sky-mid: #2b1055;
            --sky-bottom: #7597de;
            --ground-1: #0a3d0a;
            --ground-2: #145214;
            --ground-3: #1e6b1e;
            --text-main: #ffffff;
            --text-sub: #d1c4e9;
            --astro-glow: rgba(255, 255, 255, 0.4);
            --ambient-light: rgba(138, 180, 248, 0.1);
        }

        body.day-mode {
            --sky-top: #2980b9;
            --sky-mid: #6dd5fa;
            --sky-bottom: #ffffff;
            --ground-1: #27ae60;
            --ground-2: #2ecc71;
            --ground-3: #82e0aa;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --astro-glow: rgba(241, 196, 15, 0.6);
            --ambient-light: rgba(255, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Quicksand', sans-serif;
            transition: background var(--transition-speed) ease;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-mid), var(--sky-bottom));
        }

        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120%;
            z-index: 1;
            transition: opacity var(--transition-speed) ease, transform 0.1s ease-out;
            animation: moveSky 80s linear infinite;
        }

        body.day-mode .stars-container {
            opacity: 0;
            pointer-events: none;
        }

        body.night-mode .stars-container {
            opacity: 1;
        }

        @keyframes moveSky {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-20%);
            }
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .celestial-body {
            position: absolute;
            top: 8vh;
            right: 8vw;
            width: clamp(50px, 12vw, 110px);
            height: clamp(50px, 12vw, 110px);
            border-radius: 50%;
            z-index: 2;
            transition: all var(--transition-speed) ease, transform 0.1s ease-out;
        }

        body.night-mode .celestial-body {
            background: radial-gradient(circle at 30% 30%, #fff, #d1d1c1);
            box-shadow: 0 0 30px var(--astro-glow), 0 0 80px var(--astro-glow), inset -15px -15px 30px rgba(0, 0, 0, 0.2);
        }

        body.day-mode .celestial-body {
            background: radial-gradient(circle at 30% 30%, #fff7ae, #f39c12);
            box-shadow: 0 0 50px var(--astro-glow), 0 0 100px var(--astro-glow);
        }

        .clouds-container {
            position: absolute;
            top: 10vh;
            width: 200%;
            height: 100px;
            z-index: 2;
            animation: moveClouds 60s linear infinite;
            transition: opacity var(--transition-speed) ease, transform 0.1s ease-out;
        }

        body.night-mode .clouds-container {
            opacity: 0;
            pointer-events: none;
        }

        body.day-mode .clouds-container {
            opacity: 0.8;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
        }

        .cloud::after,
        .cloud::before {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        .cloud-1 {
            width: 120px;
            height: 40px;
            top: 20px;
            left: 10%;
        }

        .cloud-1::after {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 20px;
        }

        .cloud-1::before {
            width: 70px;
            height: 60px;
            top: -30px;
            left: 50px;
        }

        .cloud-2 {
            width: 100px;
            height: 35px;
            top: 50px;
            left: 55%;
        }

        .cloud-2::after {
            width: 45px;
            height: 45px;
            top: -20px;
            left: 15px;
        }

        .cloud-2::before {
            width: 60px;
            height: 50px;
            top: -25px;
            left: 40px;
        }

        @keyframes moveClouds {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        .ground-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 5;
            transition: background var(--transition-speed) ease;
        }

        .ground-back {
            height: 32vh;
            background: var(--ground-1);
            border-radius: 50% 50% 0 0 / 20% 20% 0 0;
        }

        .ground-mid {
            height: 25vh;
            background: var(--ground-2);
            border-radius: 60% 40% 0 0 / 30% 20% 0 0;
            left: -5%;
            width: 110%;
        }

        .ground-front {
            height: 18vh;
            background: var(--ground-3);
            border-radius: 40% 60% 0 0 / 20% 40% 0 0;
            left: 5%;
            width: 100%;
            z-index: 6;
        }

        .ambient-glow {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50%;
            background: radial-gradient(circle at 50% 100%, var(--ambient-light), transparent 70%);
            z-index: 4;
            pointer-events: none;
            transition: background var(--transition-speed) ease;
        }

        .mensaje-container {
            position: absolute;
            top: 20vh;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            z-index: 20;
            animation: fadeInUp 2s ease-out forwards;
        }

        .titulo-principal {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2rem, 7vw, 5rem);
            color: var(--text-main);
            line-height: 1.25;
            margin-bottom: 12px;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.35);
            transition: color var(--transition-speed) ease;
        }

        .subtitulo {
            font-size: clamp(0.85rem, 3vw, 1.6rem);
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color var(--transition-speed) ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        #garden-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70vh;
            z-index: 10;
            pointer-events: none;
        }

        .flower-wrapper {
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
            cursor: pointer;
            pointer-events: all;
            touch-action: manipulation;
            animation: sway var(--sway-time, 4s) ease-in-out infinite alternate,
                growIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
            animation-delay: var(--delay, 0s), var(--delay, 0s);
            will-change: transform;
        }

        .flower-wrapper svg {
            overflow: visible;
            display: block;
        }

        @keyframes growIn {
            from {
                transform: scaleY(0);
                opacity: 0;
                transform-origin: bottom center;
            }

            to {
                transform: scaleY(1);
                opacity: 1;
                transform-origin: bottom center;
            }
        }

        @keyframes sway {
            0% {
                transform: rotate(calc(var(--sway-deg, 4) * -1deg));
            }

            100% {
                transform: rotate(calc(var(--sway-deg, 4) * 1deg));
            }
        }

        .flower-wrapper.touched {
            animation: flowerPop 0.4s ease forwards !important;
            filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.95));
        }

        @keyframes flowerPop {
            0% {
                transform: scale(1) rotate(0);
            }

            40% {
                transform: scale(1.28) rotate(-5deg);
            }

            70% {
                transform: scale(0.95) rotate(3deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 30;
            animation: sparkAnim 0.7s ease-out forwards;
        }

        @keyframes sparkAnim {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        .floating-message {
            position: absolute;
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            color: #ffffff;
            pointer-events: none;
            z-index: 40;
            white-space: nowrap;
            transform: translateX(-50%);
            background: rgba(20, 20, 30, 0.65);
            border-radius: 25px 25px 25px 5px;
            padding: 8px 18px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            animation: floatUp 3s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateX(-50%) translateY(0) scale(0.5);
                opacity: 0;
            }

            15% {
                transform: translateX(-50%) translateY(-10px) scale(1.05);
                opacity: 1;
            }

            100% {
                transform: translateX(-50%) translateY(-120px) scale(1);
                opacity: 0;
            }
        }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
        }

        #sound-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        #sound-toggle:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        #sound-toggle svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 600px) {
            .mensaje-container {
                top: 16vh;
            }

            .titulo-principal {
                font-size: clamp(1.8rem, 8vw, 3rem);
            }

            .subtitulo {
                font-size: clamp(0.75rem, 3.5vw, 1rem);
                letter-spacing: 1px;
            }

            .floating-message {
                font-size: 1.1rem;
                padding: 6px 14px;
            }
        }

        @media (max-width: 400px) {
            .mensaje-container {
                top: 13vh;
            }
        }
    </style>
</head>

<body class="night-mode">

    <div id="announcer" class="sr-only" aria-live="assertive"></div>

    <button id="sound-toggle" aria-label="Activar sonido" title="Sonido">
        <svg id="sound-icon-on" viewBox="0 0 24 24">
            <path
                d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
        </svg>
        <svg id="sound-icon-off" viewBox="0 0 24 24" style="display:none">
            <path
                d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
        </svg>
    </button>

    <div class="stars-container" id="stars"></div>
    <div class="celestial-body"></div>
    <div class="clouds-container">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
    </div>
    <div class="ambient-glow"></div>
    <div class="ground-layer ground-back"></div>
    <div class="ground-layer ground-mid"></div>
    <div class="ground-layer ground-front"></div>
    <div class="mensaje-container">
        <h1 class="titulo-principal" id="title-dynamic" aria-live="polite">Cargando...</h1>
        <div class="subtitulo" id="sub-dynamic" aria-live="polite"></div>
    </div>
    <div id="garden-container" aria-hidden="true"></div>
    <canvas id="particles-canvas" aria-hidden="true"></canvas>

    <script>
        (function () {
            // ═══ Referencias DOM ═══
            const titleEl = document.getElementById('title-dynamic');
            const subEl = document.getElementById('sub-dynamic');
            const announcer = document.getElementById('announcer');
            const garden = document.getElementById('garden-container');
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            const starsContainer = document.getElementById('stars');
            const celestialBody = document.querySelector('.celestial-body');
            const cloudsContainer = document.querySelector('.clouds-container');
            const soundToggle = document.getElementById('sound-toggle');
            const soundIconOn = document.getElementById('sound-icon-on');
            const soundIconOff = document.getElementById('sound-icon-off');

            // ═══ Estado global ═══
            let isNightMode = true;
            let creatures = [];
            let shootingStars; // Se asignará después de definir la clase ShootingStar
            let shootingStarTimeout;
            let animFrameId;
            let isPageVisible = true;
            let soundEnabled = true;
            let audioCtx = null;
            let ambientOsc = null;
            let ambientGain = null;

            // ═══ Utilidades ═══
            const STEMS = ['#388E3C', '#2E7D32', '#33691E'];
            const LEAVES = ['#43A047', '#33691E', '#2E7D32', '#558B2F'];
            const sparkleColors = ['#ffeb3b', '#ff4081', '#4caf50', '#00e5ff', '#ffffff', '#ff9800', '#ce93d8', '#80deea'];
            const loveMessages = [
                "Qué hermosa te quiero ❤️", "Eres la mejor 🌹", "Me encantan tus ojos",
                "Tus ojos brillan más que las estrellas ✨", "Me pierdo en tu mirada",
                "Tu pelo está increíble 💇‍♀️", "Me encanta tu cabello", "Tu sonrisa me alegra el día",
                "Me haces muy feliz", "Eres especial para mí", "Contigo todo es mejor",
                "Qué suerte tenerte", "Me encantas mucho", "Eres luz en mi día 🌸",
                "Eres mi persona favorita", "Te pienso todo el día",
                "Eres un sueño hecho realidad", "Eres única y especial",
                "Contigo todo es mágico", "Eres la mejor compañía 🌺"
            ];
            const lastMessages = [];

            function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

            function getUniqueMessage() {
                const available = loveMessages.filter(m => !lastMessages.includes(m));
                if (available.length === 0) {
                    lastMessages.length = 0;
                    return rnd(loveMessages);
                }
                const msg = rnd(available);
                lastMessages.push(msg);
                if (lastMessages.length > 5) lastMessages.shift();
                return msg;
            }

            // ═══ Sonido ═══
            function initAudio() {
                if (audioCtx) return;
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    soundEnabled = false;
                    updateSoundIcon();
                    return;
                }
                const masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.25;
                masterGain.connect(audioCtx.destination);
                window._masterGain = masterGain;
                startAmbient();
            }

            function playPopSound() {
                if (!soundEnabled || !audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.connect(gain);
                gain.connect(window._masterGain || audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            function startAmbient() {
                if (!audioCtx || !soundEnabled) return;
                stopAmbient();
                const now = audioCtx.currentTime;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.03, now + 1);
                ambientGain = gain;

                if (isNightMode) {
                    const bufferSize = 4096;
                    const noise = audioCtx.createScriptProcessor(bufferSize, 1, 1);
                    noise.onaudioprocess = function (e) {
                        const output = e.outputBuffer.getChannelData(0);
                        let lastOut = 0;
                        for (let i = 0; i < bufferSize; i++) {
                            const white = Math.random() * 2 - 1;
                            output[i] = (lastOut + (0.02 * white)) / 1.02;
                            lastOut = output[i];
                        }
                    };
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 1800;
                    filter.Q.value = 0.5;
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(window._masterGain || audioCtx.destination);
                    ambientOsc = noise;
                } else {
                    const bufferSize = 4096;
                    const noise = audioCtx.createScriptProcessor(bufferSize, 1, 1);
                    noise.onaudioprocess = function (e) {
                        const output = e.outputBuffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            output[i] = Math.random() * 2 - 1;
                        }
                    };
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 400;
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(window._masterGain || audioCtx.destination);
                    ambientOsc = noise;
                }
                ambientOsc && ambientOsc.connect && ambientOsc.connect(gain);
            }

            function stopAmbient() {
                if (ambientOsc) {
                    if (ambientOsc.disconnect) ambientOsc.disconnect();
                    ambientOsc = null;
                }
                if (ambientGain) {
                    ambientGain.disconnect();
                    ambientGain = null;
                }
            }

            function updateSoundIcon() {
                if (soundEnabled) {
                    soundIconOn.style.display = 'block';
                    soundIconOff.style.display = 'none';
                    soundToggle.setAttribute('aria-label', 'Silenciar sonido');
                } else {
                    soundIconOn.style.display = 'none';
                    soundIconOff.style.display = 'block';
                    soundToggle.setAttribute('aria-label', 'Activar sonido');
                }
            }

            soundToggle.addEventListener('click', () => {
                if (!audioCtx) initAudio();
                soundEnabled = !soundEnabled;
                if (soundEnabled) {
                    startAmbient();
                } else {
                    stopAmbient();
                }
                updateSoundIcon();
                if (window._masterGain) {
                    window._masterGain.gain.value = soundEnabled ? 0.25 : 0;
                }
            });

            // ═══ Funciones SVG Flores ═══
            function stem(x1, y1, x2, y2, w) { return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${rnd(STEMS)}" stroke-width="${w}" stroke-linecap="round"/>`; }
            function leaf(cx, cy, rx, ry, angle) { return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${rnd(LEAVES)}" transform="rotate(${angle} ${cx} ${cy})"/>`; }
            const gerberaPalettes = [
                { outer: '#ffffff', mid: '#f0f0f0', inner: '#e0e0e0', center: '#FFB300', dot: '#E65100', stroke: '#cccccc' },
                { outer: '#E53935', mid: '#c62828', inner: '#b71c1c', center: '#FDD835', dot: '#F57F17', stroke: '#b71c1c' },
                { outer: '#E91E63', mid: '#c2185b', inner: '#ad1457', center: '#FDD835', dot: '#E65100', stroke: '#ad1457' },
                { outer: '#FF9800', mid: '#f57c00', inner: '#e65100', center: '#FDD835', dot: '#333', stroke: '#e65100' },
                { outer: '#9C27B0', mid: '#7b1fa2', inner: '#4a148c', center: '#FDD835', dot: '#1a1a1a', stroke: '#4a148c' },
                { outer: '#FDD835', mid: '#fbc02d', inner: '#f9a825', center: '#E53935', dot: '#333', stroke: '#f9a825' },
                { outer: '#26C6DA', mid: '#0097A7', inner: '#006064', center: '#FDD835', dot: '#333', stroke: '#006064' },
            ];
            function makeGerbera(pal, S) {
                const stemH = 68 * S, R = 26 * S, cx = 0, cy = -stemH;
                const W = (R + 6) * 2.6, H = stemH + R * 2.8;
                let p = '';
                for (let i = 0; i < 22; i++) {
                    const a = (360 / 22) * i;
                    p += `<ellipse cx="${cx}" cy="${cy - R * 0.45}" rx="${3.2 * S}" ry="${R * 0.85}"
                fill="${pal.outer}" stroke="${pal.stroke}" stroke-width="${0.5 * S}"
                transform="rotate(${a} ${cx} ${cy})"/>`;
                }
                for (let i = 0; i < 14; i++) {
                    const a = (360 / 14) * i + (360 / 44);
                    p += `<ellipse cx="${cx}" cy="${cy - R * 0.38}" rx="${2.8 * S}" ry="${R * 0.62}"
                fill="${pal.mid}" stroke="${pal.stroke}" stroke-width="${0.4 * S}"
                transform="rotate(${a} ${cx} ${cy})"/>`;
                }
                for (let i = 0; i < 8; i++) {
                    const a = (360 / 8) * i + (360 / 16);
                    p += `<ellipse cx="${cx}" cy="${cy - R * 0.25}" rx="${3.5 * S}" ry="${R * 0.38}"
                fill="${pal.inner}" transform="rotate(${a} ${cx} ${cy})"/>`;
                }
                return `<svg width="${W}" height="${H}"
            viewBox="${-W / 2} ${-(stemH + R * 2.6)} ${W} ${H}"
            xmlns="http://www.w3.org/2000/svg">
            ${stem(0, 0, cx, -stemH, 4 * S)}
            ${leaf(-9 * S, -stemH * 0.42, 13 * S, 4.5 * S, -42)}

                    hg.addColorStop(0, '#FFF176'); hg.addColorStop(1, '#F9A825');
                    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, -bs * 1.05, bs * 0.52, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath(); ctx.arc(-bs * 0.22, -bs * 1.12, bs * 0.14, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(bs * 0.22, -bs * 1.12, bs * 0.14, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#333'; ctx.lineWidth = 1.2;
                    ctx.beginPath(); ctx.moveTo(-bs * 0.2, -bs * 1.5); ctx.quadraticCurveTo(-bs * 0.8, -bs * 2.3, -bs * 0.6, -bs * 2.6); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(bs * 0.2, -bs * 1.5); ctx.quadraticCurveTo(bs * 0.8, -bs * 2.3, bs * 0.6, -bs * 2.6); ctx.stroke();
                    ctx.fillStyle = '#333';
                    ctx.beginPath(); ctx.arc(-bs * 0.6, -bs * 2.6, bs * 0.15, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(bs * 0.6, -bs * 2.6, bs * 0.15, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
            }

            class SunMote {
                constructor() { this.reset(true); }
                reset(init) {
                    this.x = Math.random() * canvas.width; this.y = init ? Math.random() * canvas.height * 0.8 : canvas.height * 0.8;
                    this.size = Math.random() * 2 + 0.8; this.speedY = -(Math.random() * 0.35 + 0.1);
                    this.speedX = (Math.random() - 0.5) * 0.25; this.opacity = Math.random() * 0.55 + 0.15;
                    this.wobbleAmp = Math.random() * 0.3; this.wobbleFreq = Math.random() * 0.02 + 0.01; this.phase = Math.random() * Math.PI * 2;
                }
                update() { this.y += this.speedY; this.x += this.speedX + Math.sin(this.y * this.wobbleFreq + this.phase) * this.wobbleAmp; if (this.y < -10) this.reset(false); }
                draw() {
                    ctx.save(); ctx.globalAlpha = this.opacity;
                    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
                    g.addColorStop(0, 'rgba(255,253,200,1)'); g.addColorStop(0.5, 'rgba(255,245,150,0.5)'); g.addColorStop(1, 'rgba(255,245,150,0)');
                    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,240,0.9)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                }
            }

            class ShootingStar {
                constructor() { this.active = false; }
                trigger() {
                    this.active = true; this.x = Math.random() * canvas.width * 0.7; this.y = Math.random() * canvas.height * 0.3;
                    this.len = Math.random() * 100 + 60; this.speed = Math.random() * 14 + 10;
                    this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.3; this.opacity = 1; this.width = Math.random() * 2 + 1;
                }
                update() {
                    if (!this.active) return;
                    this.x += Math.cos(this.angle) * this.speed; this.y += Math.sin(this.angle) * this.speed;
                    this.opacity -= 0.018;
                    if (this.opacity <= 0 || this.x > canvas.width || this.y > canvas.height) this.active = false;
                }
                draw() {
                    if (!this.active) return;
                    ctx.save(); ctx.globalAlpha = this.opacity;
                    const g = ctx.createLinearGradient(this.x, this.y, this.x - Math.cos(this.angle) * this.len, this.y - Math.sin(this.angle) * this.len);
                    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.3, 'rgba(200,220,255,0.6)'); g.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.strokeStyle = g; ctx.lineWidth = this.width; ctx.shadowBlur = 12; ctx.shadowColor = '#fff';
                    ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x - Math.cos(this.angle) * this.len, this.y - Math.sin(this.angle) * this.len); ctx.stroke(); ctx.restore();
                }
            }

            class FallingPetal {
                constructor() { this.reset(true); }
                reset(init) {
                    this.x = Math.random() * canvas.width;
                    this.y = init ? Math.random() * canvas.height * 0.3 : -20;
                    this.size = Math.random() * 3 + 2;
                    this.speedY = Math.random() * 0.6 + 0.2;
                    this.speedX = (Math.random() - 0.5) * 0.4;
                    this.wobble = Math.random() * 0.05 + 0.02;
                    this.phase = Math.random() * Math.PI * 2;
                    this.opacity = Math.random() * 0.6 + 0.2;
                    this.angle = Math.random() * 360;
                    this.angleSpeed = (Math.random() - 0.5) * 2;
                    this.pink = Math.random() > 0.5 ? 'rgba(255,182,193,' : 'rgba(255,228,225,';
                }
                update() {
                    this.y += this.speedY;
                    this.x += this.speedX + Math.sin(this.y * this.wobble + this.phase) * 0.3;
                    this.angle += this.angleSpeed;
                    if (this.y > canvas.height + 20) this.reset(false);
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.opacity;
                    ctx.translate(this.x, this.y);
                    ctx.rotate((this.angle * Math.PI) / 180);
                    ctx.fillStyle = this.pink + '0.7)';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 1.2, this.size * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ═══ Inicialización de las estrellas fugaces (después de definir la clase) ═══
            shootingStars = [new ShootingStar(), new ShootingStar(), new ShootingStar()];

            // ═══ Funciones de población del canvas ═══
            function getCreatureCounts() {
                const w = window.innerWidth;
                if (w < 600) return { fireflies: 15, bees: 3, motes: 20, petals: 15 };
                if (w < 1024) return { fireflies: 22, bees: 5, motes: 28, petals: 25 };
                return { fireflies: 30, bees: 7, motes: 35, petals: 35 };
            }

            function initCreatures() {
                creatures = [];
                clearTimeout(shootingStarTimeout);
                const counts = getCreatureCounts();
                if (isNightMode) {
                    for (let i = 0; i < counts.fireflies; i++) creatures.push(new Firefly());
                    triggerShootingStar();
                } else {
                    for (let i = 0; i < counts.bees; i++) creatures.push(new Bee(i));
                    for (let i = 0; i < counts.motes; i++) creatures.push(new SunMote());
                    for (let i = 0; i < counts.petals; i++) creatures.push(new FallingPetal());
                }
                shootingStars.forEach(s => s.active = false);
            }

            function triggerShootingStar() {
                if (!isNightMode || !isPageVisible) return;
                const available = shootingStars.find(s => !s.active);
                if (available) available.trigger();
                shootingStarTimeout = setTimeout(triggerShootingStar, Math.random() * 5000 + 2500);
            }

            function animateCanvas() {
                if (!isPageVisible) {
                    animFrameId = requestAnimationFrame(animateCanvas);
                    return;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                creatures.forEach(c => { c.update(); c.draw(); });
                shootingStars.forEach(s => { s.update(); s.draw(); });
                animFrameId = requestAnimationFrame(animateCanvas);
            }

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                creatures.forEach(c => {
                    if (c.reset) c.reset(typeof c.trailX !== 'undefined' ? false : true);
                });
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // ═══ Parallax ═══
            let parallaxX = 0, parallaxY = 0;
            function applyParallax() {
                const factorStars = 0.01;
                const factorClouds = 0.005;
                const factorBody = 0.02;
                starsContainer.style.transform = `translate(${parallaxX * factorStars}px, ${parallaxY * factorStars}px)`;
                cloudsContainer.style.transform = `translate(${parallaxX * factorClouds}px, ${parallaxY * factorClouds}px)`;
                celestialBody.style.transform = `translate(${parallaxX * factorBody}px, ${parallaxY * factorBody}px)`;
            }
            window.addEventListener('mousemove', (e) => {
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                parallaxX = (e.clientX - centerX) * 0.5;
                parallaxY = (e.clientY - centerY) * 0.5;
                applyParallax();
            });
            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma !== null && e.beta !== null) {
                    parallaxX = e.gamma * 2;
                    parallaxY = (e.beta - 45) * 2;
                    applyParallax();
                }
            });

            // ═══ Visibilidad de página ═══
            document.addEventListener('visibilitychange', () => {
                isPageVisible = !document.hidden;
                if (isPageVisible) {
                    if (soundEnabled && audioCtx && !ambientOsc) startAmbient();
                    if (isNightMode) triggerShootingStar();
                } else {
                    stopAmbient();
                    clearTimeout(shootingStarTimeout);
                    shootingStars.forEach(s => s.active = false);
                }
            });

            // ═══ Interacción Flores ═══
            garden.addEventListener('click', (e) => {
                const flower = e.target.closest('.flower-wrapper');
                if (!flower) return;
                flower.classList.remove('touched');
                void flower.offsetWidth;
                flower.classList.add('touched');
                setTimeout(() => flower.classList.remove('touched'), 500);
                for (let i = 0; i < 14; i++) {
                    const s = document.createElement('div');
                    s.className = 'sparkle';
                    s.style.left = e.pageX + 'px';
                    s.style.top = e.pageY + 'px';
                    s.style.background = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
                    s.style.setProperty('--tx', (Math.random() - 0.5) * 130 + 'px');
                    s.style.setProperty('--ty', (Math.random() - 0.5) * 130 - 40 + 'px');
                    document.body.appendChild(s);
                    setTimeout(() => s.remove(), 700);
                }
                const msg = getUniqueMessage();
                const msgEl = document.createElement('div');
                msgEl.className = 'floating-message';
                msgEl.textContent = msg;
                msgEl.style.left = e.pageX + 'px';
                msgEl.style.top = (e.pageY - 40) + 'px';
                document.body.appendChild(msgEl);
                setTimeout(() => msgEl.remove(), 3000);
                announcer.textContent = msg;
                playPopSound();
                if (navigator.vibrate) {
                    navigator.vibrate(30);
                }
            });

            // ═══ Tema y texto dinámico ═══
            function updateDynamicTitle() {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const hourNow = new Date().getHours();
                const isNightText = hourNow >= 19 || hourNow < 6;
                const day1 = new Date(2026, 4, 4);
                const endDate = new Date(2026, 7, 31);
                let titleText = '';
                let subText = '';
                if (today < day1) {
                    titleText = "Preparando estadias...";
                    subText = "Falta muy poco";
                } else if (today > endDate) {
                    titleText = "¡Felices estadias!";
                    subText = "Fue un gran camino";
                } else if (isNightText) {
                    titleText = "Espero que te haya sido<br>de maravilla en tu estadía";
                    subText = "Descansa niña 💤";
                } else {
                    let targetDate = new Date(today);
                    const dow = targetDate.getDay();
                    let isWeekend = false;
                    if (dow === 6) { targetDate.setDate(targetDate.getDate() - 1); isWeekend = true; }
                    else if (dow === 0) { targetDate.setDate(targetDate.getDate() - 2); isWeekend = true; }
                    let count = 0;
                    let temp = new Date(day1);
                    while (temp <= targetDate) {
                        if (temp.getDay() !== 0 && temp.getDay() !== 6) count++;
                        temp.setDate(temp.getDate() + 1);
                    }
                    const ordinals = { 1: 'er', 2: 'do', 3: 'er' };
                    const suffix = ordinals[count] || 'to';
                    titleText = `Feliz ${count}${suffix} día<br>de estadias`;
                    subText = isWeekend ? "Disfruta tu fin de semana" : "Que te vaya super bien";
                }
                titleEl.innerHTML = titleText;
                subEl.textContent = subText;
            }

            function setTheme() {
                const h = new Date().getHours();
                const night = h >= 19 || h < 6;
                document.body.className = night ? 'night-mode' : 'day-mode';
                return night;
            }

            // ═══ Arranque ═══
            (function generateStars() {
                const c = document.getElementById('stars');
                for (let i = 0; i < 100; i++) {
                    const s = document.createElement('div');
                    s.className = 'star';
                    s.style.left = Math.random() * 100 + '%';
                    s.style.top = Math.random() * 85 + '%';
                    const z = Math.random() * 3 + 1;
                    s.style.width = z + 'px';
                    s.style.height = z + 'px';
                    s.style.animationDelay = Math.random() * 3 + 's';
                    c.appendChild(s);
                }
            })();

            isNightMode = setTheme();
            updateDynamicTitle();
            buildGarden(isNightMode);
            initCreatures();
            animateCanvas();
            updateSoundIcon();

            document.addEventListener('click', function audioUnlock() {
                if (!audioCtx) initAudio();
                document.removeEventListener('click', audioUnlock);
            }, { once: true });

            setInterval(() => {
                const wasNight = isNightMode;
                isNightMode = setTheme();
                if (wasNight !== isNightMode) {
                    buildGarden(isNightMode);
                    initCreatures();
                    updateDynamicTitle();
                    stopAmbient();
                    if (soundEnabled) startAmbient();
                }
            }, 60000);

        })();
    </script>
