<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jardín Mágico de Estadias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --transition-speed: 2s; }
        body.night-mode {
            --sky-top: #0b1026; --sky-mid: #2b1055; --sky-bottom: #7597de;
            --ground-1: #0a3d0a; --ground-2: #145214; --ground-3: #1e6b1e;
            --text-main: #ffffff; --text-sub: #d1c4e9;
            --astro-glow: rgba(255,255,255,0.4); --ambient-light: rgba(138,180,248,0.1);
            --tree-back: #031003; --tree-front: #051a05;
        }
        body.day-mode {
            --sky-top: #2980b9; --sky-mid: #6dd5fa; --sky-bottom: #ffffff;
            --ground-1: #27ae60; --ground-2: #2ecc71; --ground-3: #82e0aa;
            --text-main: #2c3e50; --text-sub: #7f8c8d;
            --astro-glow: rgba(241,196,15,0.6); --ambient-light: rgba(255,255,255,0.3);
            --tree-back: #1a5c1a; --tree-front: #1e7a1e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden; height: 100vh; width: 100vw;
            font-family: 'Quicksand', sans-serif;
            transition: background var(--transition-speed) ease;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-mid), var(--sky-bottom));
        }
        .stars-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 120%; z-index: 1;
            transition: opacity var(--transition-speed) ease;
            animation: moveSky 80s linear infinite;
        }
        body.day-mode .stars-container { opacity: 0; pointer-events: none; }
        body.night-mode .stars-container { opacity: 1; }
        @keyframes moveSky { from { transform: translateY(0); } to { transform: translateY(-20%); } }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        .celestial-body {
            position: absolute; top: 8vh; right: 8vw;
            width: clamp(50px, 12vw, 110px); height: clamp(50px, 12vw, 110px);
            border-radius: 50%; z-index: 2; overflow: hidden;
            transition: background var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
        }
        body.night-mode .celestial-body {
            background: radial-gradient(circle at 30% 30%, #fff, #d1d1c1);
            box-shadow: 0 0 30px var(--astro-glow), 0 0 80px var(--astro-glow), inset -15px -15px 30px rgba(0,0,0,0.2);
        }
        body.day-mode .celestial-body {
            background: radial-gradient(circle at 30% 30%, #fff7ae, #f39c12);
            box-shadow: 0 0 50px var(--astro-glow), 0 0 100px var(--astro-glow);
        }
        .crater { position: absolute; border-radius: 50%; background: rgba(0,0,0,0.08); transition: opacity var(--transition-speed) ease; }
        body.day-mode .crater { opacity: 0; }
        body.night-mode .crater { opacity: 1; }

        /* ☁️ Nubes generadas por JS */
        .clouds-container {
            position: absolute; top: 6vh; left: 0;
            width: 100%; height: 140px; z-index: 2;
            transition: opacity var(--transition-speed) ease;
            overflow: hidden;
        }
        body.night-mode .clouds-container { opacity: 0; pointer-events: none; }
        body.day-mode .clouds-container { opacity: 1; }
        .cloud-float { position: absolute; background: rgba(255,255,255,0.88); border-radius: 50px; }
        @keyframes cloudDrift { from { transform: translateX(110vw); } to { transform: translateX(-180px); } }

        /* 🌳 Silueta de pinos */
        .tree-silhouettes {
            position: absolute; bottom: 28vh; left: -5%; width: 110%;
            height: 18vh; z-index: 4; pointer-events: none;
            transition: color var(--transition-speed) ease;
        }
        .tree-silhouettes svg { width: 100%; height: 100%; display: block; }

        .ground-layer { position: absolute; bottom: 0; width: 100%; z-index: 5; transition: background var(--transition-speed) ease, transform 0.15s ease-out; }
        .ground-back  { height: 32vh; background: var(--ground-1); border-radius: 50% 50% 0 0 / 20% 20% 0 0; }
        .ground-mid   { height: 25vh; background: var(--ground-2); border-radius: 60% 40% 0 0 / 30% 20% 0 0; left: -5%; width: 110%; }
        .ground-front { height: 18vh; background: var(--ground-3); border-radius: 40% 60% 0 0 / 20% 40% 0 0; left: 5%; width: 100%; z-index: 6; }
        .ambient-glow {
            position: absolute; bottom: 0; width: 100%; height: 50%;
            background: radial-gradient(circle at 50% 100%, var(--ambient-light), transparent 70%);
            z-index: 4; pointer-events: none; transition: background var(--transition-speed) ease;
        }

        .mensaje-container {
            position: absolute; top: 20vh; left: 50%; transform: translateX(-50%);
            width: 90%; text-align: center; z-index: 20;
            animation: fadeInUp 2s ease-out forwards;
        }
        .titulo-principal {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2rem, 7vw, 5rem);
            color: var(--text-main); line-height: 1.25; margin-bottom: 12px;
            text-shadow: 0 2px 15px rgba(0,0,0,0.35);
            transition: color var(--transition-speed) ease;
        }
        /* 📝 Subtítulo con contraste fuerte */
        .subtitulo {
            font-size: clamp(0.85rem, 3vw, 1.6rem); font-weight: 700;
            color: var(--text-sub); letter-spacing: 2px; text-transform: uppercase;
            display: inline-block; padding: 6px 20px; border-radius: 22px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.55), 0 0 12px rgba(0,0,0,0.25);
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            transition: color var(--transition-speed) ease, background var(--transition-speed) ease, text-shadow var(--transition-speed) ease;
        }
        body.day-mode .subtitulo {
            background: rgba(255,255,255,0.4);
            text-shadow: 0 1px 4px rgba(0,0,0,0.2), 0 0 16px rgba(255,255,255,0.6);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(40px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        #garden-container {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 70vh; z-index: 10; pointer-events: none;
        }
        .flower-wrapper {
            position: absolute; bottom: 0; transform-origin: bottom center;
            cursor: pointer; pointer-events: all;
            animation: sway var(--sway-time, 4s) ease-in-out infinite alternate,
                       growIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
            animation-delay: var(--delay, 0s), var(--delay, 0s);
            will-change: transform;
        }
        .flower-wrapper svg { overflow: visible; display: block; }
        @keyframes growIn {
            from { transform: scaleY(0); opacity: 0; transform-origin: bottom center; }
            to   { transform: scaleY(1); opacity: 1; transform-origin: bottom center; }
        }
        @keyframes sway {
            0%   { transform: rotate(calc(var(--sway-deg, 4) * -1deg)); }
            100% { transform: rotate(calc(var(--sway-deg, 4) * 1deg)); }
        }
        .flower-wrapper.touched {
            animation: flowerPop 0.4s ease forwards !important;
            filter: drop-shadow(0 0 14px rgba(255,255,255,0.95));
        }
        @keyframes flowerPop {
            0%   { transform: scale(1) rotate(0); }
            40%  { transform: scale(1.28) rotate(-5deg); }
            70%  { transform: scale(0.95) rotate(3deg); }
            100% { transform: scale(1) rotate(0); }
        }
        .sparkle {
            position: absolute; width: 8px; height: 8px; border-radius: 50%;
            pointer-events: none; z-index: 30; animation: sparkAnim 0.7s ease-out forwards;
        }
        @keyframes sparkAnim {
            0%   { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* 💬 Mensaje flotante — Quicksand, más tiempo */
        .floating-message {
            position: absolute;
            font-family: 'Quicksand', sans-serif;
            font-size: clamp(1rem, 2.8vw, 1.35rem);
            font-weight: 700;
            color: #ffffff; pointer-events: none; z-index: 40;
            white-space: nowrap; transform: translateX(-50%);
            background: rgba(20,20,30,0.7);
            border-radius: 22px 22px 22px 6px;
            padding: 10px 22px;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            animation: floatUp 5s ease-out forwards;
            letter-spacing: 0.3px;
        }
        @keyframes floatUp {
            0%   { transform: translateX(-50%) translateY(0) scale(0.5); opacity: 0; }
            8%   { transform: translateX(-50%) translateY(-8px) scale(1.05); opacity: 1; }
            78%  { opacity: 1; }
            100% { transform: translateX(-50%) translateY(-150px) scale(1); opacity: 0; }
        }

        #particles-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 15; pointer-events: none;
        }

        .cursor-trail {
            position: fixed; width: 14px; height: 14px;
            border-radius: 50%; pointer-events: none; z-index: 100;
            animation: trailFade 0.7s ease-out forwards;
        }
        @keyframes trailFade { 0% { transform: scale(1); opacity: 0.85; } 100% { transform: scale(0); opacity: 0; } }

        @media (max-width: 600px) {
            .mensaje-container { top: 16vh; }
            .titulo-principal { font-size: clamp(1.8rem, 8vw, 3rem); }
            .subtitulo { font-size: clamp(0.75rem, 3.5vw, 1rem); letter-spacing: 1px; padding: 5px 14px; }
            .floating-message { font-size: 0.95rem; padding: 8px 16px; }
        }
        @media (max-width: 400px) { .mensaje-container { top: 13vh; } }
    </style>
</head>
<body class="night-mode">
    <div class="stars-container" id="stars"></div>
    <div class="celestial-body" id="celestial"></div>
    <div class="clouds-container" id="clouds"></div>
    <div class="ambient-glow"></div>
    <div class="tree-silhouettes" id="tree-silhouettes"></div>
    <div class="ground-layer ground-back" id="ground-back"></div>
    <div class="ground-layer ground-mid" id="ground-mid"></div>
    <div class="ground-layer ground-front" id="ground-front"></div>
    <div class="mensaje-container">
        <h1 class="titulo-principal" id="title-dynamic">Cargando...</h1>
        <div class="subtitulo" id="sub-dynamic"></div>
    </div>
    <div id="garden-container"></div>
    <canvas id="particles-canvas"></canvas>

<script>
// ─── TEXTO DINÁMICO ─────────────────────────────────────────────────────────
function updateDynamicTitle() {
    const today = new Date(); today.setHours(0,0,0,0);
    const hourNow = new Date().getHours();
    const isNightText = hourNow >= 19 || hourNow < 6;
    const day1 = new Date(2026,4,4);
    const endDate = new Date(2026,7,31);
    const titleEl = document.getElementById('title-dynamic');
    const subEl   = document.getElementById('sub-dynamic');
    if (today < day1)    { titleEl.innerHTML = "Preparando estadias..."; subEl.textContent = "Falta muy poco"; return; }
    if (today > endDate) { titleEl.innerHTML = "¡Felices estadias!";     subEl.textContent = "Fue un gran camino"; return; }
    if (isNightText) {
        titleEl.innerHTML = "Espero que te haya sido<br>de maravilla en tu estadía";
        subEl.textContent = "Descansa niña 💤"; return;
    }
    let targetDate = new Date(today); const dow = targetDate.getDay(); let isWeekend = false;
    if (dow === 6) { targetDate.setDate(targetDate.getDate()-1); isWeekend = true; }
    else if (dow === 0) { targetDate.setDate(targetDate.getDate()-2); isWeekend = true; }
    let count = 0; let temp = new Date(day1);
    while (temp <= targetDate) { if (temp.getDay()!==0 && temp.getDay()!==6) count++; temp.setDate(temp.getDate()+1); }
    let suffix = "to"; if(count===1) suffix="er"; else if(count===2) suffix="do"; else if(count===3) suffix="er";
    titleEl.innerHTML = `Feliz ${count}${suffix} día<br>de estadias`;
    subEl.textContent = isWeekend ? "Disfruta tu fin de semana" : "Que te vaya super bien";
}
updateDynamicTitle();

// ─── TEMA ────────────────────────────────────────────────────────────────────
function setTheme() {
    const h = new Date().getHours();
    const n = h >= 19 || h < 6;
    document.body.className = n ? 'night-mode' : 'day-mode';
    return n;
}
let isNightMode = setTheme();

// ─── ESTRELLAS ───────────────────────────────────────────────────────────────
(function generateStars() {
    const c = document.getElementById('stars');
    for (let i=0; i<100; i++) {
        const s = document.createElement('div'); s.className='star';
        s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*85+'%';
        const z = Math.random()*3+1; s.style.width=z+'px'; s.style.height=z+'px';
        s.style.animationDelay = Math.random()*3+'s'; c.appendChild(s);
    }
})();

// ─── 🌙 CRÁTERES ────────────────────────────────────────────────────────────
(function addCraters() {
    const el = document.getElementById('celestial');
    [{x:'28%',y:'32%',s:'20%'},{x:'56%',y:'22%',s:'13%'},{x:'62%',y:'56%',s:'24%'},{x:'36%',y:'64%',s:'10%'},{x:'44%',y:'42%',s:'8%'},{x:'70%',y:'38%',s:'11%'}].forEach(c => {
        const d = document.createElement('div'); d.className='crater';
        d.style.left=c.x; d.style.top=c.y; d.style.width=c.s; d.style.height=c.s;
        d.style.transform='translate(-50%,-50%)'; el.appendChild(d);
    });
})();

// ─── ☁️ NUBES GENERADAS POR JS (10 nubes variadas) ─────────────────────────
(function generateClouds() {
    const box = document.getElementById('clouds');
    for (let i = 0; i < 10; i++) {
        const c = document.createElement('div'); c.className = 'cloud-float';
        const w = Math.random() * 110 + 55;
        const h = Math.random() * 22 + 16;
        c.style.width = w + 'px'; c.style.height = h + 'px';
        c.style.top = (Math.random() * 90 + 5) + 'px';
        const dur = Math.random() * 55 + 35;
        c.style.animation = `cloudDrift ${dur}s linear infinite`;
        c.style.animationDelay = `-${Math.random() * dur}s`;
        // Box-shadow da forma de nube con un solo div
        const b1 = w * 0.32, b2 = w * 0.22, b3 = w * 0.18;
        c.style.boxShadow = `${b1}px ${-b1*0.65}px 0 ${b1*0.42}px rgba(255,255,255,0.88), ${-b2}px ${-b2*0.5}px 0 ${b2*0.52}px rgba(255,255,255,0.88), ${b3*2.2}px ${-b3*0.2}px 0 ${b3*0.28}px rgba(255,255,255,0.82)`;
        box.appendChild(c);
    }
})();

// ─── 🌳 PINOS TRIANGULARES (2 capas de profundidad) ─────────────────────────
(function generateTrees() {
    const container = document.getElementById('tree-silhouettes');
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 2000 200');
    svg.setAttribute('preserveAspectRatio', 'none');

    // Dibuja un pino de 3 capas triangulares
    function pine(cx, baseY, totalH, opacity) {
        const trunkW = Math.max(totalH * 0.055, 2);
        const trunkH = totalH * 0.14;
        // Tronco
        const tr = document.createElementNS(ns, 'rect');
        tr.setAttribute('x', cx - trunkW); tr.setAttribute('y', baseY - trunkH);
        tr.setAttribute('width', trunkW * 2); tr.setAttribute('height', trunkH);
        tr.setAttribute('fill', 'currentColor'); tr.style.opacity = opacity;
        svg.appendChild(tr);
        // 3 capas de copa (de abajo a arriba, cada vez más estrecha)
        const layers = [
            { h: 0.48, w: 0.52, yOff: 0 },
            { h: 0.42, w: 0.44, yOff: 0.30 },
            { h: 0.36, w: 0.34, yOff: 0.54 },
        ];
        for (const l of layers) {
            const lh = totalH * l.h;
            const lw = totalH * l.w;
            const topY = baseY - trunkH - totalH * l.yOff - lh;
            const botY = baseY - trunkH - totalH * l.yOff;
            const tri = document.createElementNS(ns, 'polygon');
            tri.setAttribute('points', `${cx},${topY} ${cx - lw/2},${botY} ${cx + lw/2},${botY}`);
            tri.setAttribute('fill', 'currentColor'); tri.style.opacity = opacity;
            svg.appendChild(tri);
        }
    }

    // Capa trasera — pinos pequeños, claros
    let x = Math.random() * 30 - 20;
    while (x < 2040) {
        pine(x, 200, Math.random() * 28 + 38, 0.4);
        x += Math.random() * 45 + 40;
    }
    // Capa delantera — pinos más grandes, más oscuros
    x = Math.random() * 50 - 30;
    while (x < 2050) {
        pine(x, 200, Math.random() * 45 + 60, 0.72);
        x += Math.random() * 60 + 55;
    }

    container.appendChild(svg);
})();

// ─── 🖱️ MOUSE ───────────────────────────────────────────────────────────────
let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

if (!isTouchDevice) {
    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        const cx = window.innerWidth / 2;
        const dx = (e.clientX - cx) / cx;
        document.getElementById('stars').style.marginLeft = `${dx * -18}px`;
        document.getElementById('clouds').style.marginLeft = `${dx * -14}px`;
        document.getElementById('celestial').style.transform = `translateX(${dx * -10}px)`;
        document.getElementById('tree-silhouettes').style.transform = `translateX(${dx * -10}px)`;
        document.getElementById('ground-back').style.transform = `translateX(${dx * -5}px)`;
        document.getElementById('ground-mid').style.transform = `translateX(${dx * -3}px)`;
        if (isNightMode && Math.random() > 0.5) {
            const t = document.createElement('div'); t.className = 'cursor-trail';
            t.style.left = (e.clientX - 7) + 'px'; t.style.top = (e.clientY - 7) + 'px';
            const hue = [75, 200, 280, 180][Math.floor(Math.random()*4)];
            t.style.background = `radial-gradient(circle, hsla(${hue},100%,82%,0.9), transparent)`;
            t.style.boxShadow = `0 0 10px hsla(${hue},100%,72%,0.6)`;
            document.body.appendChild(t); setTimeout(() => t.remove(), 700);
        }
    });
}

// ═══════════════════════════════════════════════════════════════════════════
//  UTILIDADES
// ═══════════════════════════════════════════════════════════════════════════
const garden = document.getElementById('garden-container');
const STEMS  = ['#388E3C','#2E7D32','#33691E'];
const LEAVES = ['#43A047','#33691E','#2E7D32','#558B2F'];
function rnd(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function stem(x1,y1,x2,y2,w){ return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${rnd(STEMS)}" stroke-width="${w}" stroke-linecap="round"/>`; }
function leaf(cx,cy,rx,ry,angle){ return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${rnd(LEAVES)}" transform="rotate(${angle} ${cx} ${cy})"/>`; }

// ═══════════════════════════════════════════════════════════════════════════
//  🌼 GERBERA
// ═══════════════════════════════════════════════════════════════════════════
const gerberaPalettes = [
    { outer:'#ffffff', mid:'#f0f0f0', inner:'#e0e0e0', center:'#FFB300', dot:'#E65100', stroke:'#cccccc' },
    { outer:'#E53935', mid:'#c62828', inner:'#b71c1c', center:'#FDD835', dot:'#F57F17', stroke:'#b71c1c' },
    { outer:'#E91E63', mid:'#c2185b', inner:'#ad1457', center:'#FDD835', dot:'#E65100', stroke:'#ad1457' },
    { outer:'#FF9800', mid:'#f57c00', inner:'#e65100', center:'#FDD835', dot:'#333', stroke:'#e65100' },
    { outer:'#9C27B0', mid:'#7b1fa2', inner:'#4a148c', center:'#FDD835', dot:'#1a1a1a', stroke:'#4a148c' },
    { outer:'#FDD835', mid:'#fbc02d', inner:'#f9a825', center:'#E53935', dot:'#333', stroke:'#f9a825' },
    { outer:'#26C6DA', mid:'#0097A7', inner:'#006064', center:'#FDD835', dot:'#333', stroke:'#006064' },
];
function makeGerbera(pal, S) {
    const stemH=68*S, R=26*S, cx=0, cy=-stemH;
    const W=(R+6)*2.6, H=stemH+R*2.8; let p='';
    for(let i=0;i<22;i++){const a=(360/22)*i;p+=`<ellipse cx="${cx}" cy="${cy-R*0.45}" rx="${3.2*S}" ry="${R*0.85}" fill="${pal.outer}" stroke="${pal.stroke}" stroke-width="${0.5*S}" transform="rotate(${a} ${cx} ${cy})"/>`;}
    for(let i=0;i<14;i++){const a=(360/14)*i+(360/44);p+=`<ellipse cx="${cx}" cy="${cy-R*0.38}" rx="${2.8*S}" ry="${R*0.62}" fill="${pal.mid}" stroke="${pal.stroke}" stroke-width="${0.4*S}" transform="rotate(${a} ${cx} ${cy})"/>`;}
    for(let i=0;i<8;i++){const a=(360/8)*i+(360/16);p+=`<ellipse cx="${cx}" cy="${cy-R*0.25}" rx="${3.5*S}" ry="${R*0.38}" fill="${pal.inner}" transform="rotate(${a} ${cx} ${cy})"/>`;}
    return `<svg width="${W}" height="${H}" viewBox="${-W/2} ${-(stemH+R*2.6)} ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${stem(0,0,cx,-stemH,4*S)}${leaf(-9*S,-stemH*0.42,13*S,4.5*S,-42)}${leaf(9*S,-stemH*0.68,13*S,4.5*S,42)}${p}<circle cx="${cx}" cy="${cy}" r="${8*S}" fill="${pal.center}"/><circle cx="${cx}" cy="${cy}" r="${5*S}" fill="${pal.dot}"/><circle cx="${cx}" cy="${cy}" r="${2.5*S}" fill="${pal.center}" opacity="0.7"/><circle cx="${cx-2*S}" cy="${cy-2*S}" r="${1.5*S}" fill="rgba(255,255,255,0.5)"/></svg>`;
}

// ═══════════════════════════════════════════════════════════════════════════
//  🌷 TULIPÁN
// ═══════════════════════════════════════════════════════════════════════════
const tulipPalettes = [
    { p1:'#F44336', p2:'#b71c1c', hi:'rgba(255,180,180,0.3)' },
    { p1:'#9C27B0', p2:'#4A148C', hi:'rgba(206,147,216,0.3)' },

        case 'sunflower': return makeSunflower(rnd(sunflowerPalettes), S);
    }
}
const DAY_FLOWERS   = ['sunflower','sunflower','paeony','paeony','gerbera','gerbera','tulip'];
const NIGHT_FLOWERS = ['lotus','lotus','orchid','orchid','gerbera','gerbera','tulip'];

function spawnFlower(layer, night) {
    let sz, op, zi, bot;
    if (layer==='back')     { sz=Math.random()*0.18+0.28; op=0.55; zi=7; bot=Math.random()*14+25; }
    else if(layer==='mid')  { sz=Math.random()*0.20+0.50; op=0.82; zi=8; bot=Math.random()*10+14; }
    else                    { sz=Math.random()*0.25+0.72; op=1;    zi=9; bot=Math.random()*8+5;   }
    const pool = night ? NIGHT_FLOWERS : DAY_FLOWERS;
    const svg  = buildFlowerSVG(rnd(pool), sz);
    if (!svg) return;
    const w = document.createElement('div');
    w.className='flower-wrapper'; w.innerHTML=svg;
    w.style.left=(Math.random()*86+4)+'%'; w.style.bottom=bot+'%';
    w.style.opacity=op; w.style.zIndex=zi;
    w.style.setProperty('--delay',(Math.random()*2.5)+'s');
    w.style.setProperty('--sway-time',(Math.random()*3+3.5)+'s');
    w.style.setProperty('--sway-deg',(Math.random()*6+2));
    if (night) w.style.filter='drop-shadow(0 0 7px rgba(200,200,255,0.35))';
    garden.appendChild(w);
}
function buildGarden(night) {
    garden.innerHTML='';
    for(let i=0;i<10;i++) spawnFlower('back',  night);
    for(let i=0;i<14;i++) spawnFlower('mid',   night);
    for(let i=0;i<10;i++) spawnFlower('front',  night);
}

// 🔥 Luciérnaga reactiva al cursor
class Firefly {
    constructor(){ this.reset(true); }
    reset(init){
        this.x=Math.random()*canvas.width;
        this.y=init?canvas.height*0.2+Math.random()*canvas.height*0.7:canvas.height*0.25+Math.random()*canvas.height*0.6;
        this.size=Math.random()*2.5+1.5; this.speedX=(Math.random()-0.5)*0.5; this.speedY=(Math.random()-0.5)*0.5;
        this.opacity=Math.random(); this.fadeDir=Math.random()>0.5?1:-1; this.fadeSpeed=Math.random()*0.015+0.005;
        this.angle=Math.random()*Math.PI*2; this.angleSpeed=(Math.random()-0.5)*0.04;
        this.trailX=[]; this.trailY=[]; this.hue=Math.random()>0.5?75:55;
    }
    update(){
        this.angle+=this.angleSpeed;
        this.x+=this.speedX+Math.sin(this.angle)*0.6;
        this.y+=this.speedY+Math.cos(this.angle*0.7)*0.4;
        if(!isTouchDevice){
            const dx=this.x-mouseX, dy=this.y-mouseY;
            const dist=Math.sqrt(dx*dx+dy*dy);
            if(dist<130&&dist>0){const f=(130-dist)/130*0.4;this.x+=dx/dist*f;this.y+=dy/dist*f;}
        }
        this.opacity+=this.fadeDir*this.fadeSpeed;
        if(this.opacity>=1){this.opacity=1;this.fadeDir=-1;}
        if(this.opacity<=0){this.opacity=0;this.fadeDir=1;}
        this.trailX.unshift(this.x); this.trailY.unshift(this.y);
        if(this.trailX.length>8){this.trailX.pop();this.trailY.pop();}
        if(this.x<-20||this.x>canvas.width+20||this.y<-20||this.y>canvas.height+20) this.reset(false);
    }
    draw(){
        for(let i=1;i<this.trailX.length;i++){
            const a=(this.opacity*(1-i/this.trailX.length))*0.4;
            ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=`hsl(${this.hue},100%,70%)`;
            ctx.shadowBlur=8; ctx.shadowColor=`hsl(${this.hue},100%,60%)`;
            ctx.beginPath(); ctx.arc(this.trailX[i],this.trailY[i],this.size*(1-i/this.trailX.length)*0.8,0,Math.PI*2); ctx.fill(); ctx.restore();
        }
        ctx.save(); ctx.globalAlpha=this.opacity;
        const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.size*5);
        g.addColorStop(0,`hsla(${this.hue},100%,75%,0.4)`); g.addColorStop(1,`hsla(${this.hue},100%,75%,0)`);
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(this.x,this.y,this.size*5,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=20; ctx.shadowColor=`hsl(${this.hue},100%,70%)`;
        ctx.fillStyle=`hsl(${this.hue},100%,90%)`; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
}

// 🐝 Abeja
class Bee {
    constructor(i){ this.index=i; this.reset(); }
    reset(){
        this.x=-60; this.baseY=canvas.height*0.25+Math.random()*canvas.height*0.5;
        this.y=this.baseY; this.speedX=Math.random()*1.8+1.2;
        this.wingAngle=Math.random()*Math.PI*2; this.bodySize=Math.random()*3+7;
        this.phase=Math.random()*Math.PI*2; this.wobble=Math.random()*30+20;
        this.pathFreq=Math.random()*0.015+0.01; this.delay=this.index*180;
    }
    update(){
        this.delay=Math.max(0,this.delay-1); if(this.delay>0) return;
        this.x+=this.speedX; this.wingAngle+=0.45;
        this.y=this.baseY+Math.sin(this.x*this.pathFreq+this.phase)*this.wobble;
        if(this.x>canvas.width+70){this.x=-60;this.baseY=canvas.height*0.25+Math.random()*canvas.height*0.5;this.phase=Math.random()*Math.PI*2;this.speedX=Math.random()*1.8+1.2;}
    }
    draw(){
        if(this.delay>0) return;
        const{x,y,bodySize:bs,wingAngle}=this; ctx.save(); ctx.translate(x,y);
        const wf=Math.abs(Math.sin(wingAngle)),wf2=Math.abs(Math.sin(wingAngle+0.8));
        ctx.fillStyle='rgba(210,230,255,0.72)'; ctx.strokeStyle='rgba(100,160,220,0.5)'; ctx.lineWidth=0.8;
        ctx.beginPath(); ctx.ellipse(-bs*0.7,-bs*0.7,bs*0.9,wf*bs*1.1,-0.4,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(bs*0.7,-bs*0.7,bs*0.9,wf2*bs*1.1,0.4,0,Math.PI*2); ctx.fill(); ctx.stroke();
        const bg=ctx.createRadialGradient(-bs*0.2,-bs*0.3,0,0,0,bs);
        bg.addColorStop(0,'#FFE066'); bg.addColorStop(0.5,'#FFB300'); bg.addColorStop(1,'#F57F17');
        ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(0,0,bs*0.6,bs,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(20,10,0,0.85)';
        for(let s=0;s<3;s++){ctx.beginPath();ctx.ellipse(0,-bs*0.3+s*bs*0.38,bs*0.5,bs*0.22,0,0,Math.PI*2);ctx.fill();}
        const hg=ctx.createRadialGradient(-bs*0.15,-bs*1.2,0,0,-bs*1.1,bs*0.55);
        hg.addColorStop(0,'#FFF176'); hg.addColorStop(1,'#F9A825');
        ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(0,-bs*1.05,bs*0.52,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#1a1a1a';
        ctx.beginPath();ctx.arc(-bs*0.22,-bs*1.12,bs*0.14,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(bs*0.22,-bs*1.12,bs*0.14,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#333'; ctx.lineWidth=1.2;
        ctx.beginPath();ctx.moveTo(-bs*0.2,-bs*1.5);ctx.quadraticCurveTo(-bs*0.8,-bs*2.3,-bs*0.6,-bs*2.6);ctx.stroke();
        ctx.beginPath();ctx.moveTo(bs*0.2,-bs*1.5);ctx.quadraticCurveTo(bs*0.8,-bs*2.3,bs*0.6,-bs*2.6);ctx.stroke();
        ctx.fillStyle='#333';
        ctx.beginPath();ctx.arc(-bs*0.6,-bs*2.6,bs*0.15,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(bs*0.6,-bs*2.6,bs*0.15,0,Math.PI*2);ctx.fill();
        ctx.restore();
    }
}

// 🦋 Mariposa
class Butterfly {
    constructor(){ this.reset(); }
    reset(){
        this.x=Math.random()*canvas.width;
        this.y=canvas.height*0.12+Math.random()*canvas.height*0.55;
        this.size=Math.random()*5+7;
        this.wingAngle=Math.random()*Math.PI*2;
        this.wingSpeed=Math.random()*0.12+0.08;
        this.dirX=Math.random()>0.5?1:-1;
        this.speedX=(Math.random()*0.7+0.3)*this.dirX;
        this.wobblePhase=Math.random()*Math.PI*2;
        this.wobbleFreq=Math.random()*0.025+0.01;
        this.wobbleAmp=Math.random()*1.8+0.5;
        this.turnTimer=Math.random()*300+100;
        const pals=[{w:'#FF9800',a:'#E65100',s:'#fff3e0'},{w:'#E91E63',a:'#880E4F',s:'#fce4ec'},{w:'#2196F3',a:'#0D47A1',s:'#e3f2fd'},{w:'#FFEB3B',a:'#F57F17',s:'#fffde7'},{w:'#9C27B0',a:'#4A148C',s:'#f3e5f5'},{w:'#FF5722',a:'#BF360C',s:'#fbe9e7'},{w:'#00BCD4',a:'#006064',s:'#e0f7fa'},{w:'#8BC34A',a:'#33691E',s:'#f1f8e9'}];
        this.colors=pals[Math.floor(Math.random()*pals.length)];
    }
    update(){
        this.wingAngle+=this.wingSpeed;
        this.wobblePhase+=this.wobbleFreq;
        this.x+=this.speedX;
        this.y+=Math.sin(this.wobblePhase)*this.wobbleAmp;
        this.turnTimer--;
        if(this.turnTimer<=0){this.dirX*=-1;this.speedX=(Math.random()*0.7+0.3)*this.dirX;this.turnTimer=Math.random()*300+100;}
        if(this.x<-40)this.x=canvas.width+40;
        if(this.x>canvas.width+40)this.x=-40;
        this.y=Math.max(canvas.height*0.05,Math.min(this.y,canvas.height*0.78));
    }
    draw(){
        const{x,y,size:s,wingAngle,colors,dirX}=this;
        const flap=Math.abs(Math.sin(wingAngle));
        ctx.save(); ctx.translate(x,y); ctx.scale(dirX,1);
        ctx.globalAlpha=0.1; ctx.fillStyle='#000';
        ctx.beginPath(); ctx.ellipse(3,s*0.9,s*0.5,s*0.12,0,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=1;
        ctx.save(); ctx.transform(1,0,0,flap,0,0);
        ctx.fillStyle=colors.w;
        ctx.beginPath(); ctx.ellipse(s*0.55,-s*0.2,s*0.95,s*0.75,-0.25,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle=colors.a; ctx.lineWidth=0.9; ctx.stroke();
        ctx.fillStyle=colors.s; ctx.beginPath(); ctx.arc(s*0.55,-s*0.25,s*0.28,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(-s*0.55,-s*0.2,s*0.95,s*0.75,0.25,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle=colors.s; ctx.beginPath(); ctx.arc(-s*0.55,-s*0.25,s*0.28,0,Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.save(); ctx.transform(1,0,0,flap*0.85,0,0);
        ctx.globalAlpha=0.82; ctx.fillStyle=colors.w;
        ctx.beginPath(); ctx.ellipse(s*0.42,s*0.35,s*0.6,s*0.48,0.2,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle=colors.a; ctx.lineWidth=0.7; ctx.stroke();
        ctx.beginPath(); ctx.ellipse(-s*0.42,s*0.35,s*0.6,s*0.48,-0.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.globalAlpha=1; ctx.restore();
        ctx.fillStyle='#2c2c2c'; ctx.beginPath(); ctx.ellipse(0,0,s*0.1,s*0.55,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#2c2c2c'; ctx.beginPath(); ctx.arc(0,-s*0.6,s*0.15,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#2c2c2c'; ctx.lineWidth=0.8;
        ctx.beginPath(); ctx.moveTo(-s*0.05,-s*0.7); ctx.quadraticCurveTo(-s*0.35,-s*1.15,-s*0.45,-s*1.2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(s*0.05,-s*0.7); ctx.quadraticCurveTo(s*0.35,-s*1.15,s*0.45,-s*1.2); ctx.stroke();
        ctx.fillStyle='#2c2c2c';
        ctx.beginPath(); ctx.arc(-s*0.45,-s*1.2,1.2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(s*0.45,-s*1.2,1.2,0,Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

// 🌸 Pétalo cayendo
class FallingPetal {
    constructor(){ this.reset(true); }
    reset(init){
        this.x=Math.random()*canvas.width;
        this.y=init?Math.random()*canvas.height:-20;
        this.size=Math.random()*5+3;
        this.speedY=Math.random()*0.7+0.25;
        this.speedX=Math.random()*0.4-0.2;
        this.rotation=Math.random()*Math.PI*2;
        this.rotSpeed=(Math.random()-0.5)*0.035;
        this.wobblePhase=Math.random()*Math.PI*2;
        this.wobbleFreq=Math.random()*0.018+0.008;
        this.wobbleAmp=Math.random()*1.5+0.5;
        this.opacity=Math.random()*0.45+0.25;
        this.color=['#f8bbd0','#f48fb1','#fce4ec','#ffffff','#fff9c4','#ffccbc','#e1bee7'][Math.floor(Math.random()*7)];
    }
    update(){
        this.wobblePhase+=this.wobbleFreq;
        this.x+=this.speedX+Math.sin(this.wobblePhase)*this.wobbleAmp;
        this.y+=this.speedY; this.rotation+=this.rotSpeed;
        if(this.y>canvas.height+20) this.reset(false);
    }
    draw(){
        ctx.save(); ctx.globalAlpha=this.opacity;
        ctx.translate(this.x,this.y); ctx.rotate(this.rotation);
        ctx.fillStyle=this.color;
        ctx.beginPath(); ctx.ellipse(0,0,this.size,this.size*0.55,0,0,Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

// 💫 Estrella fugaz
class ShootingStar {
    constructor(){ this.active=false; }
    trigger(){
        this.active=true; this.x=Math.random()*canvas.width*0.7; this.y=Math.random()*canvas.height*0.3;
        this.len=Math.random()*100+60; this.speed=Math.random()*14+10;
        this.angle=Math.PI/4+(Math.random()-0.5)*0.3; this.opacity=1; this.width=Math.random()*2+1;
    }
    update(){
        if(!this.active)return;
        this.x+=Math.cos(this.angle)*this.speed; this.y+=Math.sin(this.angle)*this.speed;
        this.opacity-=0.018;
        if(this.opacity<=0||this.x>canvas.width||this.y>canvas.height) this.active=false;
    }
    draw(){
        if(!this.active)return;
        ctx.save(); ctx.globalAlpha=this.opacity;
        const g=ctx.createLinearGradient(this.x,this.y,this.x-Math.cos(this.angle)*this.len,this.y-Math.sin(this.angle)*this.len);
        g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.3,'rgba(200,220,255,0.6)'); g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.strokeStyle=g; ctx.lineWidth=this.width; ctx.shadowBlur=12; ctx.shadowColor='#fff';
        ctx.beginPath(); ctx.moveTo(this.x,this.y); ctx.lineTo(this.x-Math.cos(this.angle)*this.len,this.y-Math.sin(this.angle)*this.len); ctx.stroke(); ctx.restore();
    }
}

// ☀️ Mota de sol
class SunMote {
    constructor(){ this.reset(true); }
    reset(init){
        this.x=Math.random()*canvas.width; this.y=init?Math.random()*canvas.height*0.8:canvas.height*0.8;
        this.size=Math.random()*2+0.8; this.speedY=-(Math.random()*0.35+0.1);
        this.speedX=(Math.random()-0.5)*0.25; this.opacity=Math.random()*0.55+0.15;
        this.wobbleAmp=Math.random()*0.3; this.wobbleFreq=Math.random()*0.02+0.01; this.phase=Math.random()*Math.PI*2;
    }
    update(){ this.y+=this.speedY; this.x+=this.speedX+Math.sin(this.y*this.wobbleFreq+this.phase)*this.wobbleAmp; if(this.y<-10) this.reset(false); }
    draw(){
        ctx.save(); ctx.globalAlpha=this.opacity;
        const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.size*3);
        g.addColorStop(0,'rgba(255,253,200,1)'); g.addColorStop(0.5,'rgba(255,245,150,0.5)'); g.addColorStop(1,'rgba(255,245,150,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(this.x,this.y,this.size*3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(255,255,240,0.9)'; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
}

// ─── LOOP ────────────────────────────────────────────────────────────────────
const shootingStars=[new ShootingStar(),new ShootingStar(),new ShootingStar()];
function triggerShootingStar(){
    if(!isNightMode)return;
    const a=shootingStars.find(s=>!s.active); if(a) a.trigger();
    shootingStarTimeout=setTimeout(triggerShootingStar,Math.random()*5000+2500);
}
function initCreatures(){
    creatures=[]; clearTimeout(shootingStarTimeout);
    if(isNightMode){
        for(let i=0;i<30;i++) creatures.push(new Firefly());
        triggerShootingStar(); shootingStars.forEach(s=>s.active=false);
    } else {
        for(let i=0;i<5;i++) creatures.push(new Bee(i));
        for(let i=0;i<6;i++) creatures.push(new Butterfly());
        for(let i=0;i<30;i++) creatures.push(new SunMote());
        for(let i=0;i<18;i++) creatures.push(new FallingPetal());
        shootingStars.forEach(s=>s.active=false);
    }
}
function animateCanvas(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    creatures.forEach(c=>{c.update();c.draw();});
    shootingStars.forEach(s=>{s.update();s.draw();});
    requestAnimationFrame(animateCanvas);
}
initCreatures(); animateCanvas();

// ─── ACTUALIZACIÓN PERIÓDICA ─────────────────────────────────────────────────
setInterval(()=>{
    const wasNight=isNightMode; isNightMode=setTheme();
    if(wasNight!==isNightMode){ buildGarden(isNightMode); initCreatures(); updateDynamicTitle(); }
},60000);
</script>
